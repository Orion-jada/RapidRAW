name: Sync with upstream

# Once a day, merges new commits from CyberTimon/RapidRAW into this fork. The merge is pushed only
# if it applies cleanly and the app still builds. Otherwise the run fails, GitHub emails you, and
# the branch is left as it was.
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to sync (for testing; normally main)'
        default: 'main'

permissions:
  contents: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    if: github.repository == 'Orion-jada/RapidRAW'
    runs-on: macos-14
    env:
      BRANCH: ${{ inputs.branch || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          # Pushing upstream changes to .github/workflows needs a token with the workflow scope.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/CyberTimon/RapidRAW.git
          # No tags: this fork has its own v1.6.5 and upstream's must not replace it.
          git fetch --no-tags upstream main

          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" -eq 0 ]; then
            echo "Already up to date with upstream." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git merge --no-edit -m "Merge upstream RapidRAW ($behind new commits)" upstream/main; then
            {
              echo "## Upstream merge needs a hand"
              echo "Merging $behind new upstream commit(s) into \`$BRANCH\` conflicts in:"
              git diff --name-only --diff-filter=U | sed 's/^/- /'
              echo
              echo "\`$BRANCH\` was left unchanged. Merge \`upstream/main\` locally and resolve the conflicts."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.merge.outputs.behind != '0'
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.merge.outputs.behind != '0'
        with:
          rustflags: ''
          cache-workspaces: src-tauri

      - name: Check the merged app builds
        if: steps.merge.outputs.behind != '0'
        run: |
          npm ci
          npx vite build
          cd src-tauri
          cargo check --locked

      - name: Push
        if: steps.merge.outputs.behind != '0'
        run: |
          if ! git push origin "HEAD:$BRANCH"; then
            {
              echo "## Push failed"
              echo "The merge builds, but GitHub refused the push. If upstream changed files in"
              echo "\`.github/workflows\`, add a \`SYNC_TOKEN\` secret holding a token with the"
              echo "workflow scope, or merge \`upstream/main\` locally."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Merged ${{ steps.merge.outputs.behind }} upstream commit(s) into \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
